# 작업 공간(브랜치)에 푸시하면 합치기 요청(PR)을 자동으로 만듦. 합치기는 사람이 확인하고 누름 (자동 합치기 없음)
# 어디로 합칠지 (git-convention.md 규칙)
#   kim/2-search-bar → kim (이름 작업대가 없으면 integration, 그것도 없으면 main)
#   kim(이름 작업대)  → integration (없으면 main)
#   integration      → main
# 30분마다도 한 번 돌아서, 이 파일이 아직 없는 작업 공간에 푸시한 것도 PR을 만들어 줌
name: 자동 PR 만들기

on:
  push:
    branches-ignore: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr
  cancel-in-progress: false

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: PR이 없는 작업 공간마다 PR 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          uri() { jq -rn --arg s "$1" '$s|@uri'; }
          branches=$(gh api "repos/$REPO/branches" --paginate -q '.[] | "\(.name)\t\(.commit.sha)"')
          has() { cut -f1 <<< "$branches" | grep -qxF "$1"; }
          top() { if has integration; then echo integration; else echo main; fi; }

          while IFS=$'\t' read -r b sha; do
            [ -z "$b" ] || [ "$b" = main ] && continue
            if [ "$b" = integration ]; then base=main
            elif [[ "$b" == */* ]] && has "${b%%/*}"; then base="${b%%/*}"
            else base=$(top)
            fi

            # 이 기록으로 만든 PR이 이미 있으면(열림 · 닫힘 · 합쳐짐 모두) 건너뜀 → 닫은 PR을 다시 만들지 않음
            if gh pr list --repo "$REPO" --head "$b" --state all --json headRefOid -q '.[].headRefOid' | grep -qx "$sha"; then continue; fi
            # 열린 PR이 있으면 새 기록이 그 PR에 자동으로 붙으므로 건너뜀
            if [ "$(gh pr list --repo "$REPO" --head "$b" --state open --json number -q length)" -gt 0 ]; then continue; fi
            ahead=$(gh api "repos/$REPO/compare/$(uri "$base")...$(uri "$b")" -q .ahead_by)
            [ "$ahead" -gt 0 ] || continue

            title=$(gh api "repos/$REPO/commits/$sha" -q '.commit.message' | head -1)
            gh pr create --repo "$REPO" --base "$base" --head "$b" --title "$title" --body "$(printf '%s\n' \
              "**$b** 작업 공간에 올린 기록 ${ahead}개를 **$base** 에 합치는 요청이에요. (자동으로 만들어졌어요)" \
              "" \
              "- 바뀐 파일은 위의 **Files changed** 에서 확인해 주세요." \
              "- 팀원 확인 후 **Merge pull request** 를 누르면 합쳐져요. 자동으로 합쳐지지는 않아요." \
              "- main 에 합쳐지면 사이트(Vercel)에도 바로 반영돼요.")"
            echo "PR 만듦: $b → $base"
          done <<< "$branches"
