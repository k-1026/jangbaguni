<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페르소나별 여정 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E86A2E; --green:#12302A; --cream:#F5F3EE;
    --ink:#1d2b27; --muted:#5f6b67; --card:#ffffff; --soft:#ece7dd;
    --s1:#E86A2E; --s2:#2A8C7E; --s3:#3D6FB6; --s4:#B8860B; --s5:#7B5EA7;
    --hot:#fde8e1; --good:#e3f2ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#2b2f2d}
  body{font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);overflow:hidden}
  .viewport{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:1280px;height:720px;background:var(--cream);flex:none;transform-origin:center center;
    padding:18px 28px 12px;flex-direction:column;gap:7px;box-shadow:0 10px 40px rgba(0,0,0,.35);--c:var(--s1)}
  .slide.on{display:flex}

  /* header */
  .hd{display:flex;align-items:center;justify-content:space-between;height:30px}
  .hd .crumb{font-size:12px;color:var(--muted);font-weight:500}
  .hd .crumb b{color:var(--orange)}
  .tag{font-size:11px;font-weight:700;color:var(--green);border:1.5px solid var(--green);border-radius:999px;padding:2px 10px}

  /* profile */
  .pf{display:grid;grid-template-columns:300px 1fr 330px;gap:10px;height:104px}
  .who{background:var(--green);color:#fff;border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center}
  .who .no{width:54px;height:54px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex:none}
  .who h2{font-size:21px;font-weight:900;letter-spacing:-.5px}
  .who h2 small{font-size:14px;font-weight:500;opacity:.8;margin-left:3px}
  .who .shop{font-size:12.5px;opacity:.9;margin-top:1px}
  .who .seg{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;background:#fff;color:var(--c);border-radius:4px;padding:1px 7px}
  .facts{background:var(--card);border-radius:10px;padding:9px 14px;display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;align-content:center}
  .facts div{font-size:11.5px;line-height:1.35;display:flex;gap:8px}
  .facts dt{flex:none;width:66px;color:var(--muted);font-weight:500}
  .facts dd{font-weight:500}
  .voice{background:var(--card);border-radius:10px;padding:10px 14px;border-left:5px solid var(--c);display:flex;flex-direction:column;justify-content:center;gap:5px}
  .voice .q{font-size:13.5px;font-weight:700;line-height:1.4;color:var(--green)}
  .voice .w{font-size:11px;color:var(--muted);line-height:1.4}
  .voice .w b{color:var(--ink)}

  /* journey grid */
  .map{display:grid;grid-template-columns:112px repeat(5,1fr);gap:6px;flex:1;grid-template-rows:56px 78px 58px 56px 1fr 66px 66px}
  .rl{display:flex;flex-direction:column;justify-content:center;font-size:12.5px;font-weight:900;color:var(--green);padding-left:4px;border-left:3px solid var(--soft)}
  .rl small{font-size:10px;font-weight:500;color:var(--muted)}
  .stage{background:var(--green);color:#fff;padding:6px 10px 6px 22px;
    clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%,13px 50%)}
  .stage .n{display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--orange);font-size:10.5px;font-weight:900;align-items:center;justify-content:center;margin-right:5px;vertical-align:1px}
  .stage .nm{font-size:14.5px;font-weight:900}
  .stage .tm{font-size:10.5px;opacity:.75;margin-left:4px}
  .stage .sc{font-size:10.5px;color:#ffd9c6;margin-top:3px}
  .c{background:var(--card);border-radius:6px;padding:6px 9px;font-size:11.3px;line-height:1.42;overflow:hidden}
  .c.act{border-top:3px solid var(--c)}
  .c.tp{font-size:10.8px;color:#40504b;background:#faf8f3;border:1px dashed #d7cfbf}
  .c.th{font-size:11px;color:var(--green);font-weight:500;position:relative;background:#fff7f1;border-radius:12px 12px 12px 3px}
  .c.pain{background:var(--hot)}
  .c.opp{background:var(--good)}
  .c.pain::before{content:"불편 ";font-weight:900;color:#c0392b;font-size:10.5px}
  .c.opp::before{content:"기회 ";font-weight:900;color:var(--s2);font-size:10.5px}
  .emo{grid-column:2 / span 5;background:var(--card);border-radius:6px}
  .emo svg{display:block;width:100%;height:100%}

  .ft{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);height:14px}
  .ft b{color:var(--orange)}

  /* nav */
  .nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;
    background:rgba(18,48,42,.92);padding:6px 10px;border-radius:999px;z-index:9;transition:opacity .4s}
  .nav.hide{opacity:0;pointer-events:none}
  .nav button{border:0;background:transparent;color:#fff;font:700 13px "Noto Sans KR",sans-serif;cursor:pointer;
    min-width:26px;height:26px;border-radius:50%}
  .nav button.on{background:var(--orange)}
  .nav button:hover:not(.on){background:rgba(255,255,255,.15)}
  .nav .arrow{font-size:15px}

  @media print{
    @page{size:1280px 720px;margin:0}
    html,body{background:none;overflow:visible;height:auto}
    .viewport{display:block;width:auto;height:auto}
    .slide{display:flex!important;transform:none!important;box-shadow:none;break-after:page}
    .nav{display:none}
  }
</style>
</head>

<div class="viewport" id="vp"></div>
<nav class="nav" id="nav" aria-label="페르소나 이동"></nav>

    </div>
    <div class="pf">

// 감정 곡선
const NS = 'http://www.w3.org/2000/svg';
document.querySelectorAll('svg[data-emo]').forEach(svg => {
  const vals = svg.dataset.emo.split(',').map(Number);
  const c = getComputedStyle(svg.closest('.slide')).getPropertyValue('--c').trim() || '#E86A2E';
  const W = 1106, col = (W - 24) / 5, y = v => 48 - v * 18;
  const xs = vals.map((_, i) => col/2 + i*(col+6));
  const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  el('line', {x1:0, x2:W, y1:y(0), y2:y(0), stroke:'#d6cfc1', 'stroke-dasharray':'4 4'});
  el('text', {x:6, y:y(0)-4, 'font-size':10, fill:'#8a948f'}).textContent = '보통';
  xs.slice(0,4).forEach(x => el('line', {x1:x+col/2+3, x2:x+col/2+3, y1:4, y2:92, stroke:'#eee8dc'}));
  const area = `M${xs[0]},${y(0)} ` + xs.map((x,i)=>`L${x},${y(vals[i])}`).join(' ') + ` L${xs[4]},${y(0)} Z`;
  el('path', {d:area, fill:c, opacity:.08});
  el('polyline', {points: xs.map((x,i)=>`${x},${y(vals[i])}`).join(' '), fill:'none', stroke:c, 'stroke-width':3, 'stroke-linejoin':'round'});
  xs.forEach((x,i) => {
    const v = vals[i], bad = v <= -2, good = v >= 2;
    el('circle', {cx:x, cy:y(v), r:bad||good?7:5, fill: bad?'#c0392b':good?'#2A8C7E':'#fff', stroke: bad?'#c0392b':good?'#2A8C7E':c, 'stroke-width':2.5});
    if (bad || good) el('text', {x:x-16, y: bad ? y(v)-12 : y(v)+24, 'font-size':11, 'font-weight':700, fill: bad?'#c0392b':'#2A8C7E'}).textContent = bad ? '고비' : '전환점';
  });
});

// 이동
const slides = [...document.querySelectorAll('.slide')];
const nav = document.getElementById('nav');
let cur = 0;
nav.innerHTML = `<button class="arrow" data-d="-1" aria-label="이전">‹</button>` +
  slides.map((_,i)=>`<button data-i="${i}" aria-label="페르소나 ${i+1}">${i+1}</button>`).join('') +
  `<button class="arrow" data-d="1" aria-label="다음">›</button>`;
function go(i){
  cur = (i + slides.length) % slides.length;
  slides.forEach((s,k)=>s.classList.toggle('on', k===cur));
  nav.querySelectorAll('[data-i]').forEach((b,k)=>b.classList.toggle('on', k===cur));
  history.replaceState(null, '', '#' + (cur+1));
}
nav.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  b.dataset.i !== undefined ? go(+b.dataset.i) : go(cur + +b.dataset.d); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') go(cur+1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur-1);
});
function fit(){ const s = Math.min(innerWidth/1280, innerHeight/720);
  slides.forEach(sl => sl.style.transform = `scale(${s})`); }
addEventListener('resize', fit); fit();
let idle; function wake(){ nav.classList.remove('hide'); clearTimeout(idle); idle = setTimeout(()=>nav.classList.add('hide'), 2000); }
addEventListener('mousemove', wake); addEventListener('keydown', wake); wake();
go((parseInt(location.hash.slice(1)) || 1) - 1);
