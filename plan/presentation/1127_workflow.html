<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>살피 워크 플로우 (11/19 ~ 12/3)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 720px; background: #10261f; color: #fff;
         font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; position: relative; overflow: hidden; }
  .eyebrow { position: absolute; left: 72px; top: 36px; color: #f08a4b; font-weight: 700; font-size: 19px; }
  h1 { position: absolute; left: 72px; top: 60px; font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
  .legend { position: absolute; right: 72px; top: 76px; display: flex; gap: 18px; font-size: 15px; color: #cfd8d3; }
  .legend i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
  .grid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tick { position: absolute; top: 196px; width: 2px; height: 432px; background: #fff; opacity: .9; }
  .tick b { position: absolute; top: -2px; left: 50%; transform: translate(-50%, -100%); font-size: 20px; font-weight: 800; white-space: nowrap; }
  .tick em { position: absolute; top: -30px; left: 50%; transform: translate(-50%, -100%); font-style: normal; font-size: 15px; font-weight: 800; color: #f08a4b; white-space: nowrap; }
  .row { position: absolute; left: 56px; font-size: 24px; font-weight: 800; width: 120px; text-align: center; }
  .bar { position: absolute; z-index: 1; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
         font-size: 15px; font-weight: 800; text-align: center; line-height: 1.15; padding: 0 6px; word-break: keep-all; white-space: nowrap; }
  .done { background: #d5eadc; color: #1d3a2e; }
  .now  { background: #fbe1d3; color: #d4521c; }
  .next { background: #fff; color: #1d3a2e; }
  .today { position: absolute; top: 186px; width: 6px; height: 452px; z-index: 0; background: #e8323c; border-radius: 3px; }
  .today b { position: absolute; bottom: -4px; left: 50%; transform: translate(-50%, 100%); color: #e8323c; font-size: 22px; font-weight: 800; }
    .src { position: absolute; left: 24px; bottom: 16px; font-size: 12px; color: #8ea69a; }
</style>
</head>
<body>
  <div class="eyebrow">overview</div>
  <h1>워크 플로우</h1>
  <div class="legend"><span><i style="background:#d5eadc"></i>완료</span><span><i style="background:#fbe1d3"></i>진행 중</span><span><i style="background:#fff"></i>예정</span></div>
  <div class="grid" id="grid"></div>
  <div class="src">출처: 일정 Issue #86 (11/26 체크 상태) · 작업 및 개선 11/30 ~ 12/1 마무리 · 12/1 ~ 12/2 PPT · 질의응답 준비 · 12/3 최종 발표</div>
<script>
  // 날짜 칸은 같은 너비 (지난 워크 플로우처럼). x(i) = i 번째 날짜 선
  const ticks = [["11/19"], ["11/23"], ["11/27", "중간 발표"], ["11/30"], ["12/1"], ["12/2"], ["12/3", "최종 발표"]];
  const X0 = 236, W = 154, x = (i) => X0 + i * W;
  const rows = [["기획", 226], ["개발", 310], ["AI 검증", 394], ["AI 학습", 478], ["설문", 562]];
  // [줄, 시작 칸, 끝 칸, 글, 상태]
  const bars = [
    [0, 0, 1, "피칭데이 · 레드팀", "done"],
    [0, 1, 2, "BM · 제안서", "now"],
    [0, 2, 4, "기획서 · 제안서 최종 · spec v2", "next"],
    [0, 4, 5, "PPT · 예상 질문", "next"],
    [0, 5, 6, "리허설 · 장비 점검", "next"],
    [1, 0, 1, "재고 · 판매 · 구독", "done"],
    [1, 1, 1.75, "속도 · 결제", "done"],
    [1, 1.75, 4, "실제 서버 연결 · 모바일 · 버그 · 배포", "now"],
    [1, 4, 6, "시연 점검 · 시연 녹화", "next"],
    [2, 0, 1, "OCR · 단가 · 레시피", "done"],
    [2, 1, 4, "실전 채점 2주 (AI vs 고정 공식)", "now"],
    [2, 4, 5, "채점 결과 → PPT", "next"],
    [3, 0, 1, "10년 학습 실험", "done"],
    [3, 1, 1.75, "다음 주 예측", "done"],
    [3, 1.75, 4, "새벽 자동 학습 · 기록 확인", "now"],
    [3, 4, 6, "모델 고정", "next"],
    [4, 1.5, 4, "지불 의향 설문 (네이버 자영업자 카페 · 스레드)", "now"],
    [4, 4, 5, "설문 결과 → PPT", "next"],
  ];
  const g = document.getElementById("grid");
  ticks.forEach(([d, sub], i) => g.insertAdjacentHTML("beforeend", `<div class="tick" style="left:${x(i) - 1}px"><b>${d}</b>${sub ? `<em>${sub}</em>` : ""}</div>`));
  rows.forEach(([name, y]) => g.insertAdjacentHTML("beforeend", `<div class="row" style="top:${y + 6}px">${name}</div>`));
  bars.forEach(([r, a, b, t, s]) => g.insertAdjacentHTML("beforeend",
    `<div class="bar ${s}" style="top:${rows[r][1]}px;left:${x(a) + 4}px;width:${(b - a) * W - 8}px">${t}</div>`));
  // 오늘(11/26): 11/23 ~ 11/27 칸의 3/4
  g.insertAdjacentHTML("beforeend", `<div class="today" style="left:${x(1.75) - 3}px"><b>11/26</b></div>`);
</script>
</body>
</html>
